<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wkwk 작업노트</title>
<script src="https://jjojjolonglong-sudo.github.io/mnmn/fonts.v1.js" data-app="wkwk"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFE600">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="wkwk">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://jjojjolonglong-sudo.github.io/mnmn/config.js"></script>
<script src="https://jjojjolonglong-sudo.github.io/mnmn/media.v2.js"></script>
<style>
/* 콘셉트: 오피스풍 교정쇄. 원고지 격자 위의 종이, 한쪽 귀퉁이를 자른 네모, 영수증 */
:root{
  --ink:#333B4F; --paper:#FFFFFF; --bg:#EBF1F6; --grid:#D6E4ED; --slip:#FFFBD6;
  --cy:#14B4DA; --mg:#E6338A; --ye:#FFE600; --mute:#5b6672; --dash:#9fb0bd;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  min-width:300px; color:var(--ink); background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  font-size:15px; line-height:1.4; -webkit-text-size-adjust:100%;
}
.num{font-family:'Courier New','D2Coding',monospace;font-variant-numeric:tabular-nums}

/* 네모 상자: 테두리 1.5px, 바탕색은 --bgc */
.btn,.chip,.card,.sheet,.slip,.stamp,#login,.logo,.tab{--bgc:#fff;background:var(--bgc)}
.btn,.chip,.card,.slip,.stamp,#login,.logo,.tab{position:relative}
/* 스테이플러: 큰 상자(내용 상자·로그인)의 오른쪽 위 귀퉁이에 사선으로 찝은 심 */
.sheet::after,#login::after{
  content:"";position:absolute;top:13px;right:5px;width:22px;height:2px;z-index:9;pointer-events:none;
  background:#4b5160;transform:rotate(45deg);   /* 한 줄짜리 심: 테두리보다 아주 약간 굵게, 검정보다 살짝 밝게 */
}

/* 전체 틀: 가로·세로 최대치가 있고, 머리글+탭은 고정, 그 아래만 스크롤 */
#app{max-width:820px;margin:0 auto;padding:12px 12px 8px;height:100vh;height:min(100dvh,920px);display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{--c:7px;--bgc:var(--ye);margin:0;font-family:'Courier New',monospace;font-size:22px;font-weight:800;letter-spacing:-.02em;border:1.5px solid var(--ink);padding:0 10px}
.sub{font-weight:700;font-size:13px;flex:1}
.tabs{flex:none;display:flex;gap:4px;padding-left:8px;margin-bottom:calc(-1 * var(--bw,1.5px))}   /* 탭 아래쪽이 내용 상자 윗선과 겹쳐요 */
/* 겹치는 순서: 고른 탭(맨 앞, 상자 윗선을 덮어 이어짐) > 내용 상자 > 다른 탭(맨 뒤, 아래쪽이 상자 윗선에 가려 일자로 보임) */
.tab{--c:8px;--bgc:#CFE0EA;z-index:1;font-family:inherit;padding:6px 14px 5px;margin-top:8px;border:1.5px solid var(--ink);border-bottom:0;color:var(--ink);cursor:pointer}
.tab[aria-selected=true]{--bgc:var(--ye);z-index:3;margin-top:0;padding-top:12px;padding-bottom:8px;margin-bottom:-3px}   /* 상자 윗선보다 3px 아래까지 내려와서 선을 확실히 덮어요 */
.sheet{--c:18px;position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;border:1.5px solid var(--ink);padding:0}
/* 위쪽(작품 추가·기록 추가 줄)은 고정, 그 아래만 스크롤 → 잘린 모서리와 스크롤바가 겹치지 않아요 */
.sh{flex:none;min-height:24px;padding:0 10px}   /* 모든 탭: 내용 위 여백 24px (스테이플러가 이 여백 안에 들어가요) */.scr{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 10px 20px}
.sh:empty+.scr>.pt:first-child{padding-top:0}
footer{flex:none;margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.stick{background:none;padding:24px 0 6px;margin:0 -10px;padding-left:10px;padding-right:10px}
.pt{padding-top:16px}

/* 버튼·입력 */
button{font:inherit;color:inherit}
/* 버튼 크기 두 가지로 통일: 기본(탭·칩·버튼) 14px·굵게·높이 33px / 작은 버튼 13px·굵게·높이 25px */
.btn,.chip,.tab{font-size:14px;font-weight:700;line-height:20px}
.btn{border:1.5px solid var(--ink);padding:5px 12px;cursor:pointer}
.btn.sm{font-size:13px;line-height:18px;padding:2px 9px}
.btn.pri{--bgc:var(--ye)} .btn.dng{--bgc:var(--mg);color:#fff}
.btn:hover:not(:disabled){--bgc:#F1F5F8} .btn.pri:hover:not(:disabled){--bgc:#F2D800} .btn.dng:hover:not(:disabled){--bgc:#D12A7A}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.card:focus-visible,.ar:focus-visible,.leaf:focus-visible,.cv.big:focus-visible{outline:3px solid var(--cy);outline-offset:-5px}
input:focus-visible,select:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
label{display:block;font-weight:700;font-size:13px;margin-top:10px}
input,select,textarea{display:block;width:100%;font:inherit;font-weight:400;border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:7px 8px;margin-top:3px;border-radius:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btns.ft{justify-content:flex-end}   /* 창 아래 버튼은 오른쪽에 */
.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
.empty{text-align:center;color:var(--mute);padding:36px 8px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.bar.l{justify-content:flex-start}

/* 칩 / 구분 버튼 */
.chip{border:1.5px solid var(--ink);padding:5px 12px;cursor:pointer}
.chip[aria-pressed=true]{--bgc:var(--ink);color:#fff}
.seg{display:flex}
.seg .chip{margin-left:-1.5px}.seg .chip:first-child{margin-left:0}

/* 도장 */
.stamp{--c:7px;--lc:var(--sc);display:inline-block;border:1.5px solid var(--sc);color:var(--sc);font-weight:800;font-size:12px;letter-spacing:.04em;padding:0 9px}
.stamp.pub{--bgc:var(--ye);--lc:var(--ink);border-color:var(--ink);color:var(--ink)}

/* 작품 카드 */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:8px 0 4px}
.card{--c:14px;position:relative;display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px;border:1.5px solid var(--ink);cursor:pointer}
.card:hover{--bgc:#F7FAFC}
.cv{position:relative;width:64px;height:88px;border:1.5px solid var(--ink);background:#EAF2F7;overflow:hidden;display:grid;place-items:center;color:#9fb6c4;font-weight:900;font-size:22px}
.cv::before{content:"+"}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.cv.big{width:84px;height:116px;flex:none;cursor:pointer}.cv.big:hover{background:#DDE9F1}
.ci{min-width:0}
.nm{font-weight:900;font-size:17px;overflow-wrap:anywhere}
.pn{font-size:13px;color:var(--mute)}
.mt{margin-top:4px;font-size:14px}
.sr{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pd{font-size:12px;font-weight:700}

/* 메인: 화살표 선택 + 영수증 */
/* 메인: 내용 상자 전체를 노란색으로, 영수증 내용은 가운데 */
.sheet.main{--bgc:var(--slip)}.sheet.main .scr{display:flex;align-items:center;justify-content:center}
.slip{--bgc:transparent;width:min(420px,100%);padding:0 14px 24px;text-align:center}
.slip .l1{font-weight:700;font-size:13px;padding-bottom:10px;border-bottom:1.5px dashed var(--ink)}
.slip .amt{font-size:clamp(26px,9vw,40px);font-weight:900;padding:14px 0 8px;overflow-wrap:anywhere}
.slip .l3{font-size:12px;color:var(--mute);border-top:1.5px dashed var(--ink);padding-top:8px}

/* 집계: 점선 칸 + 오른쪽 정렬 (부 / 금액 / 별) */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 54px 104px 58px}
.cols>*{min-width:0;padding:7px 8px;text-align:right}
.cols>.lb{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:calc(8px + var(--lv,0)*16px)}
.cols>*+*{border-left:1px dashed var(--dash)}
.cols .n{font-family:'Courier New','D2Coding',monospace;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cols.ch{font-size:12px;font-weight:700;color:var(--mute);border-bottom:1.5px solid var(--ink);margin-top:10px}
.cols.ch>*{padding-top:4px;padding-bottom:4px}
.ar,.leaf{border-bottom:1px dashed var(--dash);cursor:pointer}
.ar.l0{font-weight:800}
.ar.l1{font-weight:700}
.ar:hover,.leaf:hover{background:#F1F5F8}.leaf{user-select:none}
/* 작품 상세 보기 */
.vw{display:flex;gap:14px;align-items:flex-start;margin-top:8px}.cv.nv{cursor:default}.cv.nv::before{content:""}.cv.nv.e::before{content:"표지 없음";font-size:11px;font-weight:700}
.vt{min-width:0;padding-top:2px}.vt .nm{font-size:20px}.lg{margin:12px 0 0;white-space:pre-wrap;font-size:14px;line-height:1.55}.lg.e{color:var(--mute);font-size:13px}
.kv{display:grid;grid-template-columns:64px 1fr;gap:6px 10px;margin:12px 0 0;align-items:baseline}.kv dt{font-size:13px;font-weight:700;color:var(--mute)}.kv dd{margin:0}
textarea{resize:vertical;line-height:1.5}
.lockf{position:relative}.lockf input{background:#F1F4F7;color:var(--mute);cursor:not-allowed}
.lockf:hover::after{content:attr(data-tip);position:absolute;left:0;top:6px;z-index:5;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;white-space:nowrap;pointer-events:none}

/* 원고(준비중) */
.soon{text-align:center;padding:40px 12px}
.soon .stamp{font-size:20px;padding:2px 16px}

/* 대화상자 */
/* 작품·집계 창: 팝업이 아니라 내용 상자 안에 열려요 (가운데 한 단) */
.pnl{max-width:520px;margin:0 auto;padding:0 0 8px}   /* 위 여백은 다른 탭과 같은 24px(위 칸)만 */
.pnl h2{margin:0 0 4px;font-size:18px}
.pnl h3{margin:20px 0 6px;font-size:15px;border-bottom:1.5px solid var(--ink);padding-bottom:3px}
.covrow{display:flex;gap:12px;align-items:flex-start;margin-top:4px}
.ev{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--dash)}
.ev .d{flex:1;font-size:13px;min-width:120px}
.evform{margin-top:10px;padding:10px;border:1.5px dashed var(--ink)}
#w-busy{margin:12px 0 0;padding:8px 10px;background:var(--ye);border:1.5px solid var(--ink);font-weight:700;font-size:13px}

/* 로그인 */
#login{--c:18px;max-width:340px;margin:12vh auto 0;padding:18px;border:1.5px solid var(--ink)}
#login h1{margin:0 0 6px}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:90vw;background:var(--ink);color:#fff;padding:9px 14px;font-weight:700;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* 원고 탭 */
.cptb{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.cptb th{text-align:left;font-size:12px;color:var(--mute);padding:6px 8px;border-bottom:1.5px solid var(--ink);cursor:pointer;white-space:nowrap;user-select:none}
.cptb td{padding:7px 8px;border-bottom:1px dashed var(--dash);vertical-align:top;word-break:break-word}
.cptb td.num{white-space:nowrap;font-size:13px}
.cptb tr.cprow td:nth-child(3),.cptb tr.cprow td:nth-child(4){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* 작품·파일명은 한 줄을 넘으면 …으로 */
.cptb.nopv .cprow{cursor:default}.cptb.nopv .cprow:hover td{background:none}
.cprow{cursor:pointer}.cprow:hover td{background:#F1F5F8}.cprow.open td{background:var(--slip)}
.cptb tr.pv>td{padding:0;border-bottom:1.5px solid var(--ink)}
.pvbox{position:relative;height:150px;overflow:hidden;padding:8px 10px;background:#fff;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.pvbox.mute{color:var(--mute);font-size:13px}
.pvbox .lk{color:var(--mute)}
.cptb td.rfc{padding:4px 2px 4px 0;text-align:right;white-space:nowrap}.rf svg{display:block;width:15px;height:15px}
.full{padding:4px 2px 0;font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-word}.full.mute{color:var(--mute);font-size:13px}.full .lk{color:var(--mute)}
.rdh{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn.rf{border:0;--bgc:transparent;padding:0;width:26px;height:24px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;line-height:1;color:var(--mute)}   /* 원고 아이콘 버튼: 모두 같은 크기·가운데 정렬 */.btn.rf:hover:not(:disabled){--bgc:#E3EBF1;color:var(--ink)}.rf[disabled]{opacity:.5;cursor:wait}
.cpun{margin-top:22px;padding-top:12px;border-top:1.5px dashed var(--dash)}
.cpf{display:flex;align-items:center;gap:6px;font-weight:400;font-size:14px;margin:4px 0}
.cpf input{display:inline-block;width:auto;margin:0}
</style>
</head>
<body>

<div id="login" hidden>
  <h1 class="logo" style="display:inline-block">wkwk</h1>
  <label>이메일<input id="em" type="email" autocomplete="username"></label>
  <label>비밀번호<input id="pw" type="password" autocomplete="current-password"></label>
  <div class="btns"><button class="btn pri" id="go">로그인</button></div>
</div>

<div id="app" hidden>
  <header class="top">
    <h1 class="logo">wkwk</h1><span class="sub">작업노트</span>
    <button class="btn sm" id="out">로그아웃</button>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="main">메인</button>
    <button class="tab" role="tab" data-tab="works">작품</button>
    <button class="tab" role="tab" data-tab="copy">원고</button>
    <button class="tab" role="tab" data-tab="inc">집계</button>
  </nav>
  <main class="sheet" id="view"></main>
  <footer><button class="btn sm" id="inst" hidden>앱 설치</button><span>배포 후에는 Ctrl+Shift+R 로 새로고침</span></footer>
</div>

<!-- 작품 -->
<div id="park" hidden>
<div class="pnl" id="wd">
  <h2 id="wd-t">작품</h2>
  <!-- 상세 보기 -->
  <section id="wv"></section>
  <div class="btns ft" id="wv-btns"><button class="btn pri" id="w-edit" type="button">편집</button><button class="btn" id="w-close" type="button">닫기</button></div>
  <!-- 편집 (순서: 표지 · 제목 · 필명 · 로그라인 · 분량 · 가격 · 이벤트 · 별점 · 수입) -->
  <section id="we">
  <label>표지</label>
  <div class="covrow">
    <div class="cv big" id="w-cv" role="button" tabindex="0" aria-label="표지 이미지 선택"></div>
    <div>
      <input type="file" id="w-file" accept="image/*" hidden>
      <button class="btn sm" id="w-clr" type="button">표지 빼기</button>
      <p class="hint">왼쪽 박스를 누르면 이미지를 고를 수 있어요. 세로 200px WebP로 줄여서 올라가요. 파일 삭제는 mnmn에서 해요.</p>
    </div>
  </div>
  <label>제목<input id="w-name" maxlength="100"></label>
  <label>필명<input id="w-pen" maxlength="60"></label>
  <label>로그라인<textarea id="w-log" rows="3" maxlength="500" placeholder="한두 문장으로 작품 소개"></textarea></label>
  <div class="two">
    <label>분량 (만자, 공미포)<input id="w-vol" type="number" step="0.1" min="0" inputmode="decimal" placeholder="12.5"></label>
    <label>가격 (₩)<input id="w-price" type="number" step="1" min="0" inputmode="numeric"></label>
  </div>
  <section id="w-ev" hidden>
    <h3>이벤트</h3>
    <div id="ev-list"></div>
    <div class="evform">
      <label style="margin-top:0">종류<select id="e-type"></select></label>
      <div class="two">
        <label>시작일<input id="e-s" type="date" min="1900-01-01" max="2099-12-31"></label>
        <label>종료일<input id="e-e" type="date" min="1900-01-01" max="2099-12-31"></label>
      </div>
      <div class="btns" style="margin-top:10px"><button class="btn pri sm" id="e-save" type="button">추가</button><button class="btn sm" id="e-cancel" type="button" hidden>취소</button></div>
    </div>
  </section>
  <div class="two" id="w-lock">
    <div class="lockf" data-tip="별점은 집계 탭에서 수정해요"><label>별점 (가장 최근)<input id="w-star" readonly tabindex="-1"></label></div>
    <div class="lockf" data-tip="수입은 집계 탭에서 수정해요"><label>수입 (합계)<input id="w-inc" readonly tabindex="-1"></label></div>
  </div>
  <div id="w-busy" role="status" hidden></div>
  <div class="btns ft"><button class="btn pri" id="w-save" type="button">저장</button><button class="btn" id="w-cancel" type="button">취소</button><button class="btn dng" id="w-del" type="button" hidden>삭제</button></div>
  <p class="hint" id="w-pubnote" style="text-align:right" hidden>출간된 작품은 삭제할 수 없어요.</p>
  </section>
</div>

<!-- 수입 -->
<div class="pnl" id="ind">
  <h2 id="in-t">수입 기록</h2>
  <label>작품<select id="i-work"></select></label>
  <label>기간 (연월)<input id="i-span" type="month" min="1900-01" max="2099-12"></label>
  <div class="two">
    <label>판매량 (부)<input id="i-sell" type="number" min="0" step="1" inputmode="numeric"></label>
    <label>수입 (₩)<input id="i-inc" type="number" min="0" step="1" inputmode="numeric"></label>
  </div>
  <label>리디북스 별점 (별 개수)<input id="i-star" type="number" min="0" step="1" inputmode="numeric"></label>
  <div class="btns ft">
    <button class="btn pri" id="i-save" type="button">저장</button>
    <button class="btn" id="i-close" type="button">닫기</button>
    <button class="btn dng" id="i-del" type="button" hidden>삭제</button>
  </div>
</div>

</div>
<div id="toast" role="status"></div>

<script>

function measureBw(){const t=document.createElement('div');t.style.cssText='position:absolute;visibility:hidden;border-top:1.5px solid;width:0';document.body.appendChild(t);

const S={works:[],ev:[],inc:[],cp:[],tab:'main',sel:'all',iv:'month',ws:'pre',uid:null,oy:new Set(),om:new Set(),ow:null,inited:false};

/* 매월 1일 자동 집계: 그 달 1일 기준으로 이미 출간된 작품마다 이번 달 기록(빈 칸)을 만들어 둬요.
   기록이 있는 작품은 마지막 기록 다음 달부터 이번 달까지 빠진 달을 채우고, 기록이 하나도 없으면 이번 달만 만들어요. */
let autoDone=false;
const nextM=m=>{let [y,mo]=m.split('-').map(Number);mo++;if(mo>12){mo=1;y++}return y+'-'+String(mo).padStart(2,'0')};
async function autoMonthly(){
  if(autoDone)return false;autoDone=true;
  const ym=todayKST().slice(0,7),add=[];
  for(const w of S.works){
    const pd=pubDate(w);if(!pd)continue;
    const first=pd.slice(8,10)==='01'?pd.slice(0,7):nextM(pd.slice(0,7));   // 출간일 이후 처음 맞는 1일
    if(first>ym)continue;
    const have=incOf(w.id).map(i=>i.span.slice(0,7)).sort();
    let m=have.length?nextM(have[have.length-1]):ym;if(m<first)m=first;
    for(;m<=ym;m=nextM(m))add.push({work_id:w.id,user_id:S.uid,span:m+'-01',sell:null,income:null,star:null});
  }
  if(!add.length)return false;
  const {error}=await sb.from('wkwk_income').insert(add);
  if(error)for(const r of add)await sb.from('wkwk_income').insert(r);   // 다른 기기에서 먼저 만든 게 있으면 그것만 건너뛰어요
  toast(`${+ym.slice(5)}월 집계 기록 ${add.length}개를 자동으로 만들었어요`);
  return true;
}

async function loadAll(){
  const [a,b,c,d]=await Promise.all([
    sb.from('wkwk_work').select('*').order('created_at',{ascending:false}),
    sb.from('wkwk_event').select('*'),
    sb.from('wkwk_income').select('*'),
    sb.from('wkwk_copy').select('*')]);
  const er=a.error||b.error||c.error||d.error;
  if(er){fail(er);return}
  S.works=a.data;S.ev=b.data;S.inc=c.data;S.cp=d.data||[];
  if(!autoDone&&await autoMonthly()){const r=await sb.from('wkwk_income').select('*');if(!r.error)S.inc=r.data}
  render();
}

/* ---------- 원고 탭: tdtd 폴더의 .md 파일을 읽어서 작품에 연결해 보여줘요 ----------
   읽기 전용이에요. 파일에는 '연결할 때 첫 줄에 번호 한 줄(숨김 주석)'만 추가하고 본문은 건드리지 않아요.
   tdtd와 같은 사이트라서 tdtd가 기억해 둔 저장 폴더를 그대로 빌려 써요(PC Chrome/Edge). */
if(!window.kstDate)window.kstDate=d=>{const t=d==null?Date.now():new Date(d).getTime();return isNaN(t)?'':new Date(t+32400000).toISOString().slice(0,10)};
const TAG=/^<!--wk:([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?: c=(\S+?))?-->/i;
const CP={sort:'mod',dir:-1,open:null,files:null,un:[],state:'idle',dirName:'',sel:new Set(),msg:'',cache:new Map()};
function tdHandle(){return new Promise(res=>{let q;try{q=indexedDB.open('TdtdAppDB',1)}catch(e){return res(null)}
  q.onupgradeneeded=()=>{try{q.transaction.abort()}catch(e){}};   // tdtd가 만든 적 없으면 새로 만들지 않고 없는 걸로 처리
  q.onerror=()=>res(null);q.onblocked=()=>res(null);
  q.onsuccess=()=>{try{const db=q.result,x=db.transaction('handles','readonly').objectStore('handles').get('savedDirHandle');
    x.onsuccess=()=>{db.close();res(x.result||null)};x.onerror=()=>{db.close();res(null)}}catch(e){res(null)}}})}
async function copyScan(ask){
  if(CP.state==='scanning')return;
  CP.state='scanning';CP.msg='';if(S.tab==='copy')render();
  try{
    const h=await tdHandle();
    if(!h){CP.state='nohandle';return}
    CP.dirName=h.name;CP.h=h;
    let p=await h.queryPermission({mode:'readwrite'});
    if(p!=='granted'&&ask)p=await h.requestPermission({mode:'readwrite'});
    if(p!=='granted'){CP.state='perm';return}
    const {data,error}=await sb.from('wkwk_copy').select('*');if(error)throw error;S.cp=data||[];
    const files=new Map(),un=[];
    for await(const fh of h.values()){
      if(fh.kind!=='file'||!/\.md$/i.test(fh.name))continue;
      const f=await fh.getFile(),m=TAG.exec(await f.slice(0,200).text());
      const o={name:fh.name,mod:f.lastModified,size:f.size,fh};
      if(m){o.uid=m[1].toLowerCase();o.c=m[2]||'';if(files.has(o.uid)){o.dup=true;un.push(o)}else files.set(o.uid,o)}
      else un.push(o);
    }
    const known=new Set(S.cp.map(r=>(r.file_uid||'').toLowerCase()));
    for(const [uid,o] of files)if(!known.has(uid))un.push(o);   // 번호는 있는데 아직 작품에 연결 안 된 파일
    CP.files=files;CP.un=un.sort((x,y)=>y.mod-x.mod);CP.sel.clear();
    const ups=[];   // 파일명·수정일이 바뀌었으면 기록만 맞춰요(파일 내용은 건드리지 않아요)
    for(const r of S.cp){
      if(!r.file_uid)continue;const f=files.get(r.file_uid.toLowerCase());if(!f)continue;
      const patch={};if(r.copy!==f.name)patch.copy=f.name;
      if(f.mod!==Number(r.file_mtime)){patch.file_mtime=f.mod;patch.modified_at=new Date(f.mod).toISOString()}
      if(Object.keys(patch).length)ups.push(sb.from('wkwk_copy').update(patch).eq('id',r.id).then(({error})=>{if(!error)Object.assign(r,patch)}));
    }
    await Promise.all(ups);
    CP.state='ok';
  }catch(e){CP.state='err';CP.msg=e.message||String(e)}
  finally{if(S.tab==='copy')render()}
}
async function cpBody(f){return (await (await f.fh.getFile()).text()).replace(TAG,'').replace(/^\r?\n/,'')}
function cleanHtml(html){   // tdtd와 같은 규칙: 문단·줄바꿈·굵게/기울임/밑줄·정렬만 남기고 나머지는 걸러요
  const d=new DOMParser().parseFromString(html,'text/html'),out=document.createElement('div'),OK=['DIV','P','BR','SPAN','B','I','U','STRONG','EM'];
  (function walk(n,dst){for(const c of n.childNodes){
    if(c.nodeType===3){dst.append(c.nodeValue);continue}
    if(c.nodeType!==1)continue;const t=c.tagName;
    if(t==='SCRIPT'||t==='STYLE')continue;
    if(!OK.includes(t)){walk(c,dst);continue}
    if(c.classList.contains('memo')||c.classList.contains('para-memo'))continue;   // 메모는 미리보기에서 뺌
    const e=document.createElement(t.toLowerCase());
    if(c.classList.contains('lk')||c.classList.contains('locked-paragraph'))e.className='lk';
    const a=/text-align:\s*(left|right|center|justify)/.exec(c.getAttribute('style')||'');if(a)e.style.textAlign=a[1];
    if(t!=='BR')walk(c,e);dst.append(e)}})(d.body,out);
  return out}
async function cpAfter(){   // 열린 행 아래 칸에 본문을 채움
  if(!CP.open)return;const r=S.cp.find(x=>x.id===CP.open);let box=$('pvbox');if(!r||!box)return;
  const f=CP.files&&r.file_uid&&CP.files.get(r.file_uid.toLowerCase());
  if(!f){box.classList.add('mute');box.textContent=CP.state==='ok'?'폴더에서 이 파일을 찾을 수 없어요. 파일이 옮겨졌거나 지워졌을 수 있어요.':CP.state==='scanning'?'불러오는 중…':'이 기기에서는 원본 폴더를 읽을 수 없어서 본문을 볼 수 없어요.';return}
  try{
    const key=f.uid+'|'+f.mod;let node=CP.cache.get(key);
    if(!node){node=cleanHtml(await cpBody(f));CP.cache.set(key,node)}
    box=$('pvbox');if(!box||CP.open!==r.id)return;   // 그새 다른 행을 눌렀으면 그만
    fitPreview(box,node);
  }catch(e){box=$('pvbox');if(box){box.classList.add('mute');box.textContent='파일을 읽지 못했어요: '+e.message}}
}
/* 칸 크기에 들어가는 만큼의 글자까지만 보여주고, 맨 끝을 …으로 줄여요(글 단위로 자르므로 줄이 반쯤 잘려 보이지 않아요) */
const textLen=n=>{let c=0;(function w(x){for(const k of x.childNodes){if(k.nodeType===3)c+=k.nodeValue.length;else w(k)}})(n);return c};
function trimTo(root,n){let left=n;(function w(x){for(const k of [...x.childNodes]){
  if(left<=0){k.remove();continue}
  if(k.nodeType===3){if(k.nodeValue.length>left){let s=k.nodeValue.slice(0,left);if(/[\uD800-\uDBFF]$/.test(s))s=s.slice(0,-1);k.nodeValue=s;left=0}else left-=k.nodeValue.length}
  else w(k)}})(root)}
function addEllipsis(root){const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let last=null,x;while(x=tw.nextNode())if(x.nodeValue.trim())last=x;
  if(last)last.nodeValue=last.nodeValue.replace(/\s+$/,'')+'…';else root.append('…')}
function fitPreview(box,node){
  box.replaceChildren(node.cloneNode(true));
  const fits=()=>box.scrollHeight<=box.clientHeight+1;
  if(fits())return;                                   // 전부 들어가면 그대로
  let lo=0,hi=textLen(node),best=0;
  while(lo<=hi){const mid=(lo+hi)>>1,c=node.cloneNode(true);trimTo(c,mid);addEllipsis(c);box.replaceChildren(c);
    if(fits()){best=mid;lo=mid+1}else hi=mid-1}
  const c=node.cloneNode(true);trimTo(c,best);addEllipsis(c);box.replaceChildren(c);
}
function sortCp(){
  const k=CP.sort,d=CP.dir,val=r=>k==='c'?(r.date||''):k==='mod'?(r.modified_at||''):k==='work'?wname(r.work_id):(r.copy||'');
  return [...S.cp].sort((a,b)=>{const x=val(a),y=val(b);return (x<y?-1:x>y?1:0)*d||(a.id<b.id?-1:1)});
}
const REICON='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M12.5 1.8v2.8H9.7"/></svg>';
const FULLICON='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>';
/* 전체 보기: 목록 대신 상자 안에 원고 전체를 보여줘요. '‹ 목록'으로 돌아가면 보던 목록 위치 그대로 */
function vFull(){
  const r=S.cp.find(x=>x.id===CP.full);if(!r){CP.full=null;return vCopy()}
  const nm=(r.copy||'(이름 없음)').replace(/\.md$/i,'');
  return `<div class="stick"><div class="bar l"><button class="btn sm" data-cp="back">‹ 목록</button><b class="rdh" title="${esc(nm)}">${esc(nm)}</b><span class="hint rdh" style="margin:0">${esc(wname(r.work_id))}</span></div></div><div class="full" id="fullbox">불러오는 중…</div>`;
}
async function fullAfter(){
  const r=S.cp.find(x=>x.id===CP.full);let box=$('fullbox');if(!r||!box)return;
  const f=CP.files&&r.file_uid&&CP.files.get(r.file_uid.toLowerCase());
  if(!f){box.classList.add('mute');box.textContent=CP.state==='ok'?'폴더에서 이 파일을 찾을 수 없어요. 파일이 옮겨졌거나 지워졌을 수 있어요.':CP.state==='scanning'?'불러오는 중…':'이 기기에서는 원본 폴더를 읽을 수 없어서 본문을 볼 수 없어요.';return}
  try{const key=f.uid+'|'+f.mod;let node=CP.cache.get(key);if(!node){node=cleanHtml(await cpBody(f));CP.cache.set(key,node)}
    box=$('fullbox');if(box&&CP.full===r.id)box.replaceChildren(node.cloneNode(true))}
  catch(e){box=$('fullbox');if(box){box.classList.add('mute');box.textContent='파일을 읽지 못했어요: '+e.message}}
}
function vCopy(){
  if(CP.full)return vFull();
  const rows=sortCp(),st=CP.state,ar=k=>CP.sort===k?(CP.dir<0?' ▼':' ▲'):'',canOpen=typeof window.showDirectoryPicker==='function';
  const bar=`<div class="stick"><div class="bar l"><b>원고 ${rows.length}개</b>
    ${canOpen?'<button class="btn sm rf" data-cp="rescan" title="폴더 전체 다시 읽기">'+REICON+'</button>':''}
    <span class="hint" style="margin:0">${st==='ok'?'폴더: '+esc(CP.dirName):''}</span></div></div>`;
  const note=st==='scanning'?'<p class="hint">폴더를 읽는 중…</p>'

      +(open?`<tr class="pv"><td colspan="${canOpen?5:4}">`+'<div class="pvbox" id="pvbox">불러오는 중…</div></td></tr>':'');
  }).join('');
  const table=rows.length?`<table class="cptb${canOpen?'':' nopv'}"><colgroup><col style="width:92px"><col style="width:92px"><col style="width:22%"><col>${canOpen?'<col style="width:68px">':''}</colgroup><thead><tr><th data-cp="sort" data-k="c">생성일${ar('c')}</th><th data-cp="sort" data-k="mod">수정일${ar('mod')}</th><th data-cp="sort" data-k="work">작품${ar('work')}</th><th data-cp="sort" data-k="name">파일명${ar('name')}</th>${canOpen?'<th title="원고별 다시 읽기"></th>':''}</tr></thead><tbody>${body}</tbody></table>`
    :'<p class="empty">아직 연결된 원고가 없어요.</p>';
  let un='';
  if(st==='ok'&&CP.un.length){
    un=`<div class="cpun"><div class="bar"><b>연결 안 된 파일 ${CP.un.length}개</b><button class="btn sm" data-cp="unall">전체 선택</button></div>
    <p class="hint">작품을 고르고 연결하면 파일 맨 첫 줄에 번호 한 줄(숨김 주석)만 추가돼요. 본문은 바뀌지 않아요. 번호가 이미 있는 파일은 파일을 건드리지 않고 기록만 해요. 기존 파일은 처음 한 번 폴더를 복사해 두고 시작하세요.</p>
    ${CP.un.map((o,i)=>`<label class="cpf"><input type="checkbox" data-cp="chk" data-i="${i}"${CP.sel.has(i)?' checked':''}>${esc(o.name.replace(/\.md$/i,''))}<span class="hint" style="margin:0">· 수정 ${esc(kstDate(o.mod))}${o.uid?(o.dup?' · 번호 중복(복사본일 수 있어요)':' · 번호 있음'):''}</span></label>`).join('')}
    <div class="two" style="margin-top:8px"><select id="cp-work">${S.works.map(w=>`<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('')}</select><button class="btn pri" data-cp="link">선택한 파일 연결</button></div></div>`;
  }
  return bar+note+table+un;
}
/* 원고 한 줄만 다시 읽기: 그 파일의 이름·수정일을 기록에 맞추고, 미리보기도 새 내용으로 */
async function cpRefresh(btn){
  const r=S.cp.find(x=>x.id===btn.dataset.id);if(!r)return;
  if(CP.state!=='ok'||!CP.h||!CP.files)return copyScan(true);   // 폴더를 아직 못 읽었으면 전체 읽기부터
  const uid=(r.file_uid||'').toLowerCase();if(!uid)return toast('이 원고는 파일 번호가 없어요');
  btn.disabled=true;btn.textContent='…';
  try{
    let f=CP.files.get(uid),file=null;
    if(f)try{file=await f.fh.getFile();if(TAG.exec(await file.slice(0,200).text())?.[1].toLowerCase()!==uid)file=null}catch(e){file=null}
    if(!file){   // 이름이 바뀌었거나 옮겨졌으면 폴더에서 같은 번호를 찾아요
      f=null;
      for await(const fh of CP.h.values()){
        if(fh.kind!=='file'||!/\.md$/i.test(fh.name))continue;
        const ff=await fh.getFile(),m=TAG.exec(await ff.slice(0,200).text());
        if(m&&m[1].toLowerCase()===uid){f={name:fh.name,fh,uid,c:m[2]||''};file=ff;break}
      }
      if(!f){CP.files.delete(uid);toast('폴더에서 이 파일을 찾을 수 없어요');return}
      CP.files.set(uid,f);
    }
    f.name=file.name;f.mod=file.lastModified;f.size=file.size;
    const patch={};if(r.copy!==f.name)patch.copy=f.name;
    if(f.mod!==Number(r.file_mtime)){patch.file_mtime=f.mod;patch.modified_at=new Date(f.mod).toISOString()}
    if(Object.keys(patch).length){const {error}=await sb.from('wkwk_copy').update(patch).eq('id',r.id);if(error)throw error;Object.assign(r,patch)}
    toast(Object.keys(patch).length?'새로 읽었어요 · 바뀐 내용을 반영했어요':'새로 읽었어요 · 바뀐 게 없어요');
  }catch(e){toast('다시 읽지 못했어요: '+(e.message||e))}
  finally{if(S.tab==='copy')render()}
}
async function cpLink(){
  const wid=$('cp-work')&&$('cp-work').value,items=[...CP.sel].map(i=>CP.un[i]).filter(Boolean);
  if(!wid||!items.length)return toast('작품과 파일을 골라 주세요');
  if(items.some(x=>x.dup))return toast('번호가 중복된 파일은 연결할 수 없어요. 복사본이라면 지우거나 이름만 바꿔 쓰세요');
  const need=items.filter(x=>!x.uid).length;
  if(need&&!confirm(`${need}개 파일의 맨 첫 줄에 번호 한 줄을 추가해요. 본문은 바뀌지 않아요.\n폴더를 복사해 두셨나요?`))return;
  const rows=[],fails=[];
  for(const it of items){
    try{
      let uid=it.uid,c=it.c,mtime=it.mod,orig=it.mod;
      if(!uid){
        const txt=await (await it.fh.getFile()).text();
        if(TAG.test(txt.slice(0,200)))throw new Error('그새 번호가 생겼어요. 다시 읽기를 눌러 주세요');
        uid=crypto.randomUUID();c=new Date(orig).toISOString();   // 생성일은 알 수 없어서 마지막 수정일로 대신 기록해요
        const out='<!--wk:'+uid+' c='+c+'-->\n'+txt;
        const wr=await it.fh.createWritable();await wr.write(out);await wr.close();
        const f2=await it.fh.getFile();
        if(await f2.text()!==out)throw new Error('저장 확인에 실패했어요(파일은 확인이 필요해요)');
        mtime=f2.lastModified;   // 번호를 붙이느라 바뀐 수정 시각. 화면의 수정일은 원래 수정일(orig)로 둬요
      }
      rows.push({user_id:S.uid,work_id:wid,file_uid:uid,copy:it.name,date:kstDate(c)||null,modified_at:new Date(orig).toISOString(),file_mtime:mtime});
    }catch(e){fails.push(it.name+': '+e.message)}
  }
  if(rows.length){const {error}=await sb.from('wkwk_copy').insert(rows);if(error){fails.push('기록 저장 실패: '+error.message)}}
  toast(fails.length?`연결 ${rows.length}개, 실패 ${fails.length}개 — ${fails[0]}`:`${rows.length}개를 연결했어요`);
  await copyScan(false);
}
$('view').addEventListener('click',e=>{
  const b=e.target.closest('[data-cp]');if(!b||S.tab!=='copy')return;const a=b.dataset.cp;

  else if(a==='sort'){const k=b.dataset.k;if(CP.sort===k)CP.dir=-CP.dir;else{CP.sort=k;CP.dir=(k==='c'||k==='mod')?-1:1}CP.open=null;render()}

});
const sums=rs=>[rs.reduce((a,i)=>a+(i.sell||0),0),rs.reduce((a,i)=>a+(i.income||0),0)];
const arow=(cls,tg,lv,open,label,sell,inc,star)=>`<div class="cols ar ${cls}" data-tg="${tg}" tabindex="0" role="button" aria-expanded="${open}" style="--lv:${lv}"><span class="lb" title="${label}">${open?'▾':'▸'} ${label}</span><span class="n">${sell}</span><span class="n">${inc}</span><span class="n">${star}</span></div>`;
const lrow=(i,lv,label)=>`<div class="cols leaf" data-inc="${i.id}" tabindex="0" role="button" title="더블클릭해서 수정" style="--lv:${lv}"><span class="lb" title="${label}">${label}</span><span class="n">${fmtN(i.sell)}</span><span class="n">${fmtW(i.income)}</span><span class="n">${fmtN(i.star)}</span></div>`;

function vInc(){
  const mv=S.iv==='month';
  const head=`<div class="stick"><div class="bar l"><div class="seg">
    <button class="chip" data-iv="month" aria-pressed="${mv}">월별</button>
    <button class="chip" data-iv="work" aria-pressed="${!mv}">작품별</button></div>
    <button class="btn pri" data-act="addinc">+ 기록 추가</button></div>
    <div class="cols ch"><span class="lb">${mv?'연도 / 월 / 작품':'작품 / 월'}</span><span>부</span><span>금액</span><span>별</span></div></div>`;
  if(!S.inc.length)return head+'<p class="empty">아직 기록이 없어요.</p>';
  if(!S.inited){S.oy.add(S.inc.map(i=>i.span.slice(0,4)).sort().pop());S.inited=true}   // 처음엔 가장 최근 연도만 펴 둬요
  let body='';
  if(mv){
    const Y=new Map();
    for(const i of S.inc){const y=i.span.slice(0,4),m=i.span.slice(0,7);if(!Y.has(y))Y.set(y,new Map());const M=Y.get(y);(M.get(m)||M.set(m,[]).get(m)).push(i)}
    body=[...Y.keys()].sort().reverse().map(y=>{
      const M=Y.get(y),oy=S.oy.has(y),[s1,t1]=sums([...M.values()].flat());
      let h=arow('l0','y:'+y,0,oy,`${y}년`,fmtN(s1),fmtW(t1),'');
      if(oy)h+=[...M.keys()].sort().reverse().map(m=>{
        const rs=M.get(m),om=S.om.has(m),[s2,t2]=sums(rs);
        let r=arow('l1','m:'+m,1,om,`${+m.slice(5)}월`,fmtN(s2),fmtW(t2),'');
        if(om)r+=[...rs].sort((a,b)=>byPub(a.work_id,b.work_id)).map(i=>lrow(i,2,esc(wname(i.work_id)))).join('');
        return r}).join('');
      return h}).join('');
  }else{
    const W=new Map();
    for(const i of S.inc)(W.get(i.work_id)||W.set(i.work_id,[]).get(i.work_id)).push(i);
    body=[...W.keys()].sort(byPub).map(id=>{
      const rs=[...W.get(id)].sort((a,b)=>a.span<b.span?1:-1),o=S.ow===id,[s1,t1]=sums(rs);
      const st=(rs.find(x=>x.star!=null)||{}).star;     // 별은 가장 최근 값
      let h=arow('l0','w:'+id,0,o,esc(wname(id)),fmtN(s1),fmtW(t1),st==null?'':fmtN(st));
      if(o)h+=rs.map(i=>lrow(i,1,`${i.span.slice(0,4)}.${i.span.slice(5,7)}`)).join('');
      return h}).join('');
  }
  return head+body;
}

  finally{setBusy(false);e.target.value=''}
};
$('w-clr').onclick=()=>{if(cur.pend){cur.pend.close();cur.pend=null}cur.clear=true;$('w-file').value='';setCv()};
$('w-close').onclick=()=>closePanel();
const dec=v=>v===''?null:+v, int=v=>v===''?null:Math.round(+v);
$('w-save').onclick=async()=>{
  const name=$('w-name').value.trim();
  if(!name){toast('작품 이름을 입력해 주세요');return}
  const vol=dec($('w-vol').value),price=int($('w-price').value);
  if((vol!=null&&!(vol>=0))||(price!=null&&!(price>=0))){toast('분량과 가격은 0 이상 숫자로 입력해 주세요');return}
  setBusy(true,cur.pend?'이미지 업로드 중… 창을 닫지 마세요':'저장 중…');
  try{
    let cover=cur.clear?null:cur.cover;
    if(cur.pend){cover=await Media.upload(cur.pend);cur.pend.close();cur.pend=null}   // 해시 16자 반환
    const row={name,penname:$('w-pen').value.trim()||null,vol,price,cover};if(hasLog())row.logline=$('w-log').value.trim()||null;
    if(cur.id){
      const {error}=await sb.from('wkwk_work').update(row).eq('id',cur.id);
      if(fail(error))return;
      await loadAll();setBusy(false);openView(cur.id);toast('저장했어요');
    }else{
      const {data,error}=await sb.from('wkwk_work').insert({...row,user_id:S.uid}).select().single();
      if(fail(error))return;
      await loadAll();openWork(data.id);toast('저장했어요. 이벤트를 추가해 보세요');
    }
  }catch(err){toast(err.message)}
  finally{setBusy(false)}
};
$('w-del').onclick=async()=>{
  const w=S.works.find(x=>x.id===cur.id);if(!w||isPub(w))return;
  if(!confirm('작품과 연결된 이벤트·원고·수입 기록이 모두 지워져요. 삭제할까요?'))return;
  const {error}=await sb.from('wkwk_work').delete().eq('id',w.id);
  if(fail(error))return;
  closePanel();await loadAll();toast('삭제했어요');
};

/* 이벤트 */
const evDates=e=>e.start_date&&e.end_date?`${e.start_date} ~ ${e.end_date}`:e.start_date?`${e.start_date} ~`:e.end_date?`~ ${e.end_date}`:'날짜 없음';
function renderEv(){
  const w=S.works.find(x=>x.id===cur.id);
  $('w-ev').hidden=!w;
  $('w-del').hidden=!w||isPub(w);
  $('w-pubnote').hidden=!w||!isPub(w);
  if(!w)return;
  const list=sortEv(evOf(w.id)).reverse();   // 오래된 것이 위, 최근이 아래
  $('ev-list').innerHTML=list.length?list.map(e=>`<div class="ev">${stamp(e.type)}<span class="d num">${evDates(e)}</span>
    <button class="btn sm" type="button" data-eed="${e.id}">수정</button><button class="btn sm" type="button" data-edel="${e.id}">삭제</button></div>`).join(''):'<p class="hint">이벤트가 없어요. 상태는 \'미시작\'으로 보여요.</p>';
}
function resetEv(){cur.eid=null;$('e-type').value='초고';$('e-s').value='';$('e-e').value='';$('e-save').textContent='추가';$('e-cancel').hidden=true}
$('e-cancel').onclick=resetEv;
$('ev-list').addEventListener('click',async e=>{
  const ed=e.target.closest('[data-eed]'),dl=e.target.closest('[data-edel]');
  if(ed){const ev=S.ev.find(x=>x.id===ed.dataset.eed);if(!ev)return;
    cur.eid=ev.id;$('e-type').value=ev.type;$('e-s').value=ev.start_date||'';$('e-e').value=ev.end_date||'';
    $('e-save').textContent='수정 저장';$('e-cancel').hidden=false}
  else if(dl){if(!confirm('이 이벤트를 삭제할까요?'))return;
    const {error}=await sb.from('wkwk_event').delete().eq('id',dl.dataset.edel);
    if(fail(error))return;resetEv();await loadAll();renderEv()}
});
$('e-save').onclick=async()=>{
  const s=$('e-s').value||null,en=$('e-e').value||null;
  if(s&&en&&s>en){toast('종료일이 시작일보다 빨라요');return}
  const row={type:$('e-type').value,start_date:s,end_date:en};
  const r=cur.eid?await sb.from('wkwk_event').update(row).eq('id',cur.eid)
                 :await sb.from('wkwk_event').insert({...row,work_id:cur.id,user_id:S.uid});
  if(fail(r.error))return;
  resetEv();await loadAll();renderEv();
};

/* ---------- 수입 대화상자 ---------- */
let incId=null;
function openInc(id){
  if(!S.works.length){toast('먼저 작품을 추가해 주세요');return}
  const r=id?S.inc.find(x=>x.id===id):null;incId=id||null;
  const ws=[...S.works].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  $('i-work').innerHTML=ws.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('');
  const ym=todayKST().slice(0,7);   // 한국 시간 기준 이번 달
  $('in-t').textContent=r?'수입 기록 수정':'수입 기록 추가';
  $('i-work').value=r?r.work_id:ws[0].id;
  $('i-span').value=r?r.span.slice(0,7):ym;
  $('i-sell').value=r&&r.sell!=null?r.sell:'';$('i-inc').value=r&&r.income!=null?r.income:'';$('i-star').value=r&&r.star!=null?r.star:'';
  $('i-del').hidden=!r;
  openPanel('ind');
}
$('i-close').onclick=()=>closePanel();
$('i-save').onclick=async()=>{
  const m=$('i-span').value;if(!m){toast('연월을 선택해 주세요');return}
  const sell=int($('i-sell').value),income=int($('i-inc').value),star=int($('i-star').value);
  if([sell,income,star].some(v=>v!=null&&!(v>=0))){toast('0 이상 숫자로 입력해 주세요');return}
  const row={work_id:$('i-work').value,span:m+'-01',sell,income,star};
  const r=incId?await sb.from('wkwk_income').update(row).eq('id',incId)
                :await sb.from('wkwk_income').insert({...row,user_id:S.uid});
  if(r.error){toast(r.error.code==='23505'?'그 작품의 같은 연월 기록이 이미 있어요. 기존 기록을 눌러 수정해 주세요':r.error.message);return}
  closePanel();await loadAll();toast('저장했어요');
};
$('i-del').onclick=async()=>{
  if(!confirm('이 기록을 삭제할까요?'))return;
  const {error}=await sb.from('wkwk_income').delete().eq('id',incId);
  if(fail(error))return;
  closePanel();await loadAll();toast('삭제했어요');
};

/* ---------- 로그인 ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  $('login').hidden=!!session;$('app').hidden=!session;
  if(!session)return;
  S.uid=session.user.id;
  $('view').innerHTML='<p class="empty">불러오는 중…</p>';
  render();await loadAll();
}
$('go').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(!fail(error))boot();
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('out').onclick=async()=>{await sb.auth.signOut();S.works=[];S.ev=[];S.inc=[];S.cp=[];boot()};

/* ---------- 앱 설치 (PC·모바일 공통) ---------- */
let dp=null;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone)$('inst').hidden=false;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
addEventListener('appinstalled',()=>{$('inst').hidden=true});
$('inst').onclick=async()=>{
  if(dp){dp.prompt();await dp.userChoice;dp=null}
  else alert('크롬 메뉴(⋮) → "앱 설치" 또는 "홈 화면에 추가"를 눌러 주세요.\n(앱 안의 브라우저가 아니라 크롬에서 열어야 해요)');
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

boot();
</script>
</body>
</html>
